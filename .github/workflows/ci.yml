name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is TEMPORARILY SUSPENDED (2026-11-05). GitHub's macOS arm64 pool has been
        # failing to assign a runner: the job sits with runner_name empty and zero steps for ~15
        # minutes and is then cancelled, so it never executes a single step and produces no runner
        # log. Nothing in this workflow is involved — there is no timeout-minutes and no concurrency
        # group here, and a job with zero steps cannot have been affected by either.
        #
        # Observed across tamp-build: tamp#130 on 2026-11-04, then tamp#160 and tamp-syft#12 on
        # 2026-11-05 (the latter twice). The tell is decisive: tamp-grype acquired a macOS runner at
        # 16:52:42 and tamp-syft's request five seconds later at 16:52:47 never got one. GitHub's
        # status page showed all green throughout, as it did for the 2026-11-04 occurrence.
        #
        # RESTORE by adding macos-latest back to this list. Tracked in tamp#162 — this list is the
        # only thing that needs changing, and the macOS steps below are unchanged and still correct.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      TampCoreMode: package
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BUILD_LABEL: tamp-grype

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install supported .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Verify SDKs
        shell: bash
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: NuGet cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Tamp.Grype.slnx

      - name: Build
        run: dotnet build Tamp.Grype.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Tamp.Grype.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults/**/*.trx
          if-no-files-found: warn
